<!doctype html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="options">
  <fieldset>
    <span>Consider all Windows <input id="scope" type="checkbox" /> </span>
  </fieldset>
  <fieldset>
    <span
      >Whitelist mode:<input id="mode" type="checkbox" /> ( only matching tabs
      will be managed )
    </span>
  </fieldset>
  <fieldset>
    <textarea
      id="listmatchers"
      style="width: 100%; min-height: 20em"
      placeholder="Enter regular expressions line by line here
Examples:
    ^https:\/\/www\.facebook\.com.*
    ^https:\/\/example\.net.*
    ^https:\/\/.*\.wikipedia\.org.*
"
    ></textarea>
  </fieldset>
  <script type="module" src="options.js"></script>
  <script type="module" src="help.js"></script>
</body>
